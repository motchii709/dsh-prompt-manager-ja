name: release

# Publishing happens on a version tag and nowhere else:
#
#   npm version patch --no-git-tag-version     # or edit package.json by hand
#   git add -A && git commit -m "chore: 3.0.2"
#   git tag v3.0.2
#   git push origin main --follow-tags
#
# The tag is the confirmation, so nothing reaches npm by accident. The dist-tag
# follows the version: a prerelease (`3.4.0-rc.2`) publishes under `next` and
# leaves `latest` on the newest stable, while a plain version publishes as
# `latest`. Install a prerelease explicitly:
#
#   dsh plugin --profile web add @lolkda/dsh-prompt-manager@next
# Authentication is
# npm's trusted publishing (OIDC) — there is no NPM_TOKEN secret here, and none is
# wanted: npm is retiring the bypass-2FA tokens that a secret would have to hold. Set
# it up once, on the package page:
#
#   npmjs.com -> @lolkda/dsh-prompt-manager -> Settings -> Trusted Publisher
#     Organization or user: lolkda
#     Repository:           dsh-prompt-manager
#     Workflow filename:    release.yml
#     Environment:          (leave empty)
#
# `npm publish` then exchanges this run's OIDC token for a short-lived credential and
# attaches provenance, so the package page shows what it was built from. That needs
# npm >= 11.5.1, which the Node 24 toolchain below provides.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (the tag path publishes without asking)
        type: boolean
        default: false

permissions:
  contents: write   # open the GitHub release
  id-token: write   # mint the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: committed lib/ must be a build of these sources
        run: node tools/check-build.mjs

      - name: the tarball must carry the bundle patch, the browser half, and the built host
        run: npm run check:pack

      # A tag that disagrees with the manifest would publish something other than what
      # it claims, and npm has no way to take a version back.
      - name: the tag must name the version in package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag ${GITHUB_REF_NAME} / package.json ${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      - name: publish to npm
        if: github.event_name == 'push' || inputs.publish
        run: |
          version="$(node -p "require('./package.json').version")"
          # A prerelease must not take `latest` away from the newest stable: this
          # plugin's compatibility is pinned per DSH release, so a 0.1.7-rc build
          # installed by a 0.1.6 deployment is a plugin the version gate refuses.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "publishing ${version} under dist-tag ${tag}"
          npm publish --provenance --access public --tag "$tag"

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
